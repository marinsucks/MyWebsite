services:
  frontend-build:
    image: ghcr.io/marinsucks/mywebsite:latest
    pull_policy: always
    volumes:
      - frontend_assets:/output
    restart: "no"

  proxy:
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_assets:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
    depends_on:
      frontend-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  frontend_assets:
    name: mywebsite-frontend-assets
  caddy_data:
    name: mywebsite-caddy-data
  caddy_config:
    name: mywebsite-caddy-config
