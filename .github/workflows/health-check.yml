name: 🏥 Health Check

on:
  schedule:
    # Two Resend test emails per run: normally 48/day. Uses sending quota.
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['🚀 Secure Deploy']
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  health-check:
    if: github.repository == 'marinsucks/MyWebsite' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host
    steps:
    - name: Checkout deployed code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
    - name: Install locked dependencies
      run: |
        npm ci --prefix api --no-audit --no-fund
        npm ci --prefix frontend --no-audit --no-fund
        npm ci --prefix e2e --no-audit --no-fund
    - name: Build the isolated monitoring app
      env:
        VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      run: |
        npm --prefix api run build
        npm --prefix frontend run build
    - name: Check production and real providers
      env:
        MONITOR_DOMAIN: ${{ vars.DOMAIN || secrets.DOMAIN }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        RESEND_MONITOR_API_KEY: ${{ secrets.RESEND_MONITOR_API_KEY }}
      run: |
        if [ -z "$RESEND_MONITOR_API_KEY" ]; then
          echo '::notice::Checking real Turnstile verification and Resend send acceptance. Delivery status reading is disabled without a monitoring key.'
        fi
        npm --prefix e2e run test:live

  notify:
    name: Report incidents and recovery
    if: always() && needs.health-check.result != 'skipped' && github.repository == 'marinsucks/MyWebsite'
    needs: health-check
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
    - name: Checkout notification script
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
    - name: Notify the repository owner independently of email providers
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MONITOR_RESULT: ${{ needs.health-check.result }}
      run: node scripts/monitor-incident.mjs
