name: 🧪 Tests

on:
  workflow_call:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: api/package-lock.json

    - name: Install locked dependencies
      run: npm ci --no-audit --no-fund

    - name: Run tests with coverage gates
      run: npm run test:coverage

    - name: Type-check API
      run: npm run type-check

    - name: Compile API
      run: npm run build

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install locked dependencies
      run: npm ci --no-audit --no-fund

    - name: Type-check frontend
      run: npm run type-check

    - name: Lint frontend
      run: npm run lint

    - name: Build frontend
      env:
        VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      run: npm run build

  infrastructure-validation:
    name: Infrastructure validation
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Validate Compose model
      env:
        DOMAIN: example.com
        EMAIL: admin@example.com
        RESEND_API_KEY: re_ci_placeholder
        TURNSTILE_SECRET_KEY: turnstile_ci_placeholder
      run: docker compose -f compose.yml config --quiet

    - name: Validate Caddy configuration
      run: >-
        docker run --rm
        --env DOMAIN=example.com
        --env EMAIL=admin@example.com
        --volume "${{ github.workspace }}/proxy/Caddyfile:/etc/caddy/Caddyfile:ro"
        caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
        caddy validate --config /etc/caddy/Caddyfile

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        version: v0.38.2
        driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

    - name: Validate API image build
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: ./api
        push: false
        cache-from: type=gha,scope=api-ci
        cache-to: type=gha,mode=max,scope=api-ci

    - name: Validate frontend image build
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: ./frontend
        push: false
        build-args: |
          TURNSTILE_SITE_ID=1x00000000000000000000AA
        cache-from: type=gha,scope=frontend-ci
        cache-to: type=gha,mode=max,scope=frontend-ci
