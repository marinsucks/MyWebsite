name: 🚀 Secure Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOMAIN: ${{ vars.DOMAIN || secrets.DOMAIN }}
  EMAIL: ${{ vars.EMAIL || secrets.EMAIL }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || secrets.TURNSTILE_SITE_KEY }}
  TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

jobs:
  tests:
    name: 🧪 Quality gates
    uses: ./.github/workflows/tests.yaml

  security-check:
    name: 🛡️ Deployment authorization
    runs-on: ubuntu-latest
    outputs:
      safe-to-deploy: ${{ steps.check.outputs.safe }}
    steps:
    - name: Verify deployment context
      id: check
      run: |
        if [[ "${{ github.repository }}" == "marinsucks/MyWebsite" &&
              "${{ github.ref }}" == "refs/heads/master" &&
              "${{ github.actor }}" == "marinsucks" &&
              ("${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch") ]]; then
          echo "safe=true" >> "$GITHUB_OUTPUT"
        else
          echo "safe=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    name: 📦 Publish frontend image
    needs: [tests, security-check]
    if: needs.security-check.outputs.safe-to-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate deployment settings
      run: bash scripts/deployment-env.sh --check

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/mywebsite:latest
          ghcr.io/${{ github.repository_owner }}/mywebsite:${{ github.sha }}
        cache-from: type=gha,scope=frontend-ci
        cache-to: type=gha,mode=max,scope=frontend-ci
        build-args: |
          TURNSTILE_SITE_ID=${{ env.TURNSTILE_SITE_KEY }}

  deploy:
    name: 🚀 Production deployment
    needs: [security-check, build]
    if: needs.security-check.outputs.safe-to-deploy == 'true'
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
    - name: Secure checkout
      uses: actions/checkout@v4
      with:
        clean: true

    - name: Generate and validate deployment environment
      run: |
        bash scripts/deployment-env.sh --write
        make check-env
        docker compose -f compose.yml config --quiet

    - name: Stop containers
      run: |
        cd "${{ github.workspace }}"
        make down || true

    - name: Check system resources
      run: |
        echo "=== Memory Usage ==="
        free -h
        echo ""
        echo "=== Disk Usage ==="
        df -h /
        echo ""
        echo "=== CPU Info ==="
        nproc

    - name: Deploy
      timeout-minutes: 15
      run: |
        cd "${{ github.workspace }}"
        make deploy

    - name: Health check
      run: |
        sleep 15
        for i in {1..10}; do
          if curl --fail https://marinbecker.me && \
             curl --fail https://marinbecker.me/api/health; then
            echo "Health check passed on attempt $i"
            exit 0
          fi
          echo "Health check failed on attempt $i"
          if [ "$i" -lt 10 ]; then
            sleep 5
          fi
        done
        echo "Health check failed after 10 attempts"
        exit 1
