name: 🔎 Dependency security audit

# Advisory data changes independently of this repository. Keep these findings
# visible without making the reusable test/deployment gates time-dependent.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit ${{ matrix.project }} dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [api, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc

    - name: Audit locked dependencies against current advisories
      run: npm audit --package-lock-only --audit-level=high
